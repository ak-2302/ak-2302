<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="ak-2302のポートフォリオ。物理演算で動く球から各コンテンツを閲覧できます。">
    <meta name="theme-color" content="#090909">
    <link rel="stylesheet" href="./ref/style/reset.css">
    <link rel="stylesheet" href="./ref/style/style.css">
    <link rel="stylesheet" href="./ref/style/3d.css">
    <title>ak-2302 / Portfolio</title>
</head>

<body>
    <main class="site-shell">
        <header class="site-header">
            <a class="site-logo" href="./" aria-label="ak-2302 ホーム">
                <span class="site-logo__mark"></span>
                <span>ak-2302</span>
            </a>
            <p class="site-header__status"><span></span> Interactive portfolio</p>
        </header>

        <section class="hero" aria-label="ak-2302 ポートフォリオ">
            <div class="hero__copy">
                <p class="eyebrow">Personal website / 2026</p>
                <p class="hero__description">
                    6つの球が、それぞれの入り口です。<br>
                    触れて、転がして、選んでください。
                </p>
            </div>

            <div class="stage-wrap">
                <div id="physicsStage" class="physics-stage" aria-label="物理演算で動くメニュー">
                    <div class="stage-loader" id="stageLoader">
                        <span></span>
                        <p>INITIALIZING PHYSICS</p>
                    </div>
                    <noscript>このコンテンツの表示にはJavaScriptが必要です。</noscript>
                </div>
                <div class="stage-hint" aria-hidden="true">
                    <p><span class="hint-icon hint-icon--drag"></span> Drag the box</p>
                    <p><span class="hint-icon hint-icon--zoom"></span> Pinch to zoom</p>
                </div>
            </div>

            <p class="hero__index" aria-hidden="true">01 — 06</p>
            <p class="hero__scroll" aria-hidden="true">SELECT A SPHERE <span>↗</span></p>
        </section>

        <footer class="site-footer">
            <p>© <span id="currentYear"></span> ak-2302</p>
            <p>THREE.JS × PHYSIJS</p>
            <time id="currentTime">JST --:--</time>
        </footer>
    </main>

    <div class="modal" id="contentModal" aria-hidden="true">
        <button class="modal__backdrop" type="button" data-modal-close tabindex="-1" aria-label="閉じる"></button>
        <section class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div class="modal__header">
                <p id="modalNumber">01 / 06</p>
                <button class="modal__close" type="button" data-modal-close aria-label="閉じる">
                    <span></span><span></span>
                </button>
            </div>
            <div class="modal__body" id="modalContent"></div>
        </section>
    </div>

    <template id="profileContent">
        <p class="modal__label">About</p>
        <h2 data-modal-title>PROFILE</h2>
        <p class="modal__lead">Webの技術を使って、日常で役立つものや面白い体験をつくっています。</p>
        <div class="profile-grid">
            <dl>
                <dt>Name</dt>
                <dd>ak-2302</dd>
            </dl>
            <dl>
                <dt>Location</dt>
                <dd>Japan</dd>
            </dl>
            <dl>
                <dt>Focus</dt>
                <dd>Web Development</dd>
            </dl>
        </div>

        <section class="profile-section" aria-labelledby="qualificationTitle">
            <div class="profile-section__heading">
                <p>01</p>
                <h3 id="qualificationTitle">Qualifications</h3>
            </div>
            <p class="profile-empty">基本情報技術者</p>
        </section>

        <section class="profile-section" aria-labelledby="timelineTitle">
            <div class="profile-section__heading">
                <p>02</p>
                <h3 id="timelineTitle">Timeline</h3>
            </div>
            <ol class="profile-timeline">
                <li>
                    <time datetime="2022-03">2022.3</time>
                    <div>
                        <h4>Tochigi High School</h4>
                        <p>栃木高等学校を卒業</p>
                    </div>
                </li>
                <li>
                    <time datetime="2022-04">2022.4</time>
                    <div>
                        <h4>Tsukuba Univ.</h4>
                        <p>筑波大学情報学群情報科学類に入学</p>
                    </div>
                </li>
                <li>
                    <time datetime="2026-03">2026.3</time>
                    <div>
                        <h4>Tsukuba Univ.</h4>
                        <p>筑波大学情報学群情報科学類を卒業</p>
                    </div>
                </li>
                <li>
                    <time datetime="2026-04">2026.4</time>
                    <div>
                        <h4>Tsukuba Univ.</h4>
                        <p>筑波大学理工情報生命学術院システム情報工学研究群情報理工学位プログラムに入学</p>
                    </div>
                </li>
            </ol>
        </section>
    </template>

    <template id="toolContent">
        <p class="modal__label">Works</p>
        <h2 data-modal-title>TOOL</h2>
        <p class="modal__lead">手軽に使える道具をつくっています。</p>
        <a class="feature-link" href="./tool/">
            <span><small>Collection</small>Web tools</span>
            <b>VIEW ALL <i>↗</i></b>
        </a>
    </template>

    <template id="noteContent">
        <p class="modal__label">Writing</p>
        <h2 data-modal-title>NOTE</h2>
        <p class="modal__lead">思いついたことや残しておきたい文章を記述できます。このメモはこのブラウザに保存されます。</p>
        <textarea class="note-editor" id="noteEditor" rows="12" placeholder="ここに文章を入力してください。" aria-label="文章入力欄"></textarea>
        <p class="note-editor__status" id="noteEditorStatus" aria-live="polite">自動保存されます</p>
        <a class="feature-link" href="./note/page1.md">
            <span><small>Document</small>Page 1</span>
            <b>OPEN NOTE <i>↗</i></b>
        </a>
    </template>

    <template id="ideaContent">
        <p class="modal__label">Experiment</p>
        <h2 data-modal-title>IDEA</h2>
        <p class="modal__lead">まだ形になっていない、ユニークなアイデアを集める場所です。</p>
        <div class="idea-card">
            <p>MAKE SOMETHING UNEXPECTED</p>
            <span>遊び心のある実験や、新しい組み合わせをここから始めます。</span>
        </div>
    </template>

    <template id="linkContent">
        <p class="modal__label">Social</p>
        <h2 data-modal-title>LINK</h2>
        <nav class="social-links" aria-label="ソーシャルリンク">
            <a href="https://github.com/ak-2302" target="_blank"
                rel="noreferrer"><span>GitHub</span><small>github.com/ak-2302</small><b>↗</b></a>
            <a href="https://qiita.com/ak-2302" target="_blank"
                rel="noreferrer"><span>Qiita</span><small>qiita.com/ak-2302</small><b>↗</b></a>
            <a href="https://zenn.dev/ak2302" target="_blank"
                rel="noreferrer"><span>Zenn</span><small>zenn.dev/ak2302</small><b>↗</b></a>
            <a href="https://x.com/ak_2302x" target="_blank"
                rel="noreferrer"><span>X</span><small>x.com/ak_2302x</small><b>↗</b></a>
        </nav>
    </template>

    <template id="contactContent">
        <p class="modal__label">Message</p>
        <h2 data-modal-title>CONTACT</h2>
        <form class="contact-form" id="contactForm">
            <label><span>Name</span><input type="text" name="name" autocomplete="name" maxlength="80" required></label>
            <label><span>Email</span><input type="email" name="email" autocomplete="email" maxlength="254"
                    required></label>
            <label><span>Message</span><textarea name="message" rows="4" maxlength="1800" required></textarea></label>
            <div class="contact-form__footer">
                <p id="formStatus" aria-live="polite"></p>
                <button id="contactSend" type="submit">SEND MESSAGE <span>↗</span></button>
            </div>
        </form>
    </template>

    <script src="./ref/script/vendor/three.min.js"></script>
    <script src="./ref/script/vendor/physi.js"></script>
    <script src="./ref/script/3d.js"></script>
    <script src="./ref/script/script.js"></script>
</body>

</html>
