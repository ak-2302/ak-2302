<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week Lineの調整</title><link rel="stylesheet" href="../../../assets/style.css"><link rel="stylesheet" href="../../../assets/configurator.css"></head><body><header class="site-header"><a class="brand" href="../../../">OBS Widget Shelf</a><a class="back-link" href="../">← デザイン一覧</a></header><main class="config-main"><section class="config-heading"><p class="eyebrow">CLOCK / DESIGN 03</p><h1>Week Line</h1><p>曜日、日付、現在時刻を横一列に表示します。</p></section><div class="config-layout"><section class="preview-panel"><div class="preview-stage"><iframe id="widget-preview" title="週間ライン"></iframe></div><div class="preview-label"><span>LIVE PREVIEW</span><span>900 × 220</span></div></section><form class="control-panel" id="config-form" data-core="./core/" data-filename="week-line"><h2>表示を調整</h2><div class="field"><label for="lang">表記</label><select id="lang" name="lang"><option value="ja">日本語</option><option value="en">English</option></select></div><div class="field-row color-fields"><div class="field"><label for="color">文字色</label><input id="color" name="color" type="color" value="#f6f7f1"></div><div class="field"><label for="accent">アクセント</label><input id="accent" name="accent" type="color" value="#ff6b6b"></div><div class="field"><label for="bg">背景色</label><input id="bg" name="bg" type="color" value="#151618"></div></div><div class="field-row"><div class="field"><label for="outline">縁取り</label><input id="outline" name="outline" type="range" min="0" max="6" value="0"></div><div class="field"><label for="shadow">影</label><input id="shadow" name="shadow" type="range" min="0" max="30" value="10"></div></div><div class="actions"><button class="button button-primary" id="copy-button" type="button">URLをコピー</button><button class="button" id="download-button" type="button">HTMLをダウンロード</button></div><p class="url-output" id="url-output"></p></form></div><section class="usage"><h2>OBSへの追加方法</h2><ol><li>色と表記を調整します。</li><li>URLをOBSのブラウザソースへ貼り付けます。</li><li>幅900・高さ220を目安に設定します。</li></ol></section></main><div class="toast" id="toast"></div><script src="../../../assets/configurator.js"></script></body></html>
