<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="画像をブラウザ内で変換、リサイズ、補正するローカル画像ツール">
  <title>画像変換ツール</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app_shell">
    <input id="file_input" type="file" accept="image/*" hidden>

    <section class="canvas_panel panel">
      <div class="canvas_heading"><p class="section_label">CANVAS</p><button id="clear_button" class="text_button" type="button">画像を削除</button></div>
      <div id="canvas_stage" class="canvas_stage" role="button" tabindex="0" aria-label="画像を選択">
        <div id="empty_state" class="empty_state"><strong>ここに画像が表示されます</strong><span>画像を1枚選択してください。</span></div>
        <img id="canvas_image" alt="編集対象の画像" hidden>
      </div>
      <div class="canvas_meta"><span id="canvas_file_name">未選択</span><span id="canvas_dimensions">—</span><span id="canvas_size">—</span></div>
    </section>

    <aside id="settings_panel" class="settings_panel panel">
      <div class="tool_menu" role="toolbar" aria-label="画像編集メニュー">
        <button class="tool_menu_button" type="button" data-tool="format" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM8 9h8M8 13h5"/></svg><span>形式</span></button>
        <button class="tool_menu_button" type="button" data-tool="size" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5M8 8l8 8M16 8l-8 8"/></svg><span>サイズ</span></button>
        <button class="tool_menu_button" type="button" data-tool="transform" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8V4h4M18 16v4h-4M8 4a8 8 0 0 1 10 5M16 20a8 8 0 0 1-10-5M4 16h5M15 8h5"/></svg><span>変形</span></button>
        <button class="tool_menu_button" type="button" data-tool="adjust" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16M9 4v4M15 10v4M11 16v4"/></svg><span>補正</span></button>
        <button class="tool_menu_button" type="button" data-tool="crop" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4v12h12M4 8h12v12M8 8h8v8"/></svg><span>切抜き</span></button>
        <button id="convert_button" class="tool_save_button" type="button" disabled aria-label="変換して保存"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 20h14"/></svg><span>保存</span></button>
      </div>
      <div id="tool_popover" class="tool_popover" hidden>
        <section class="tool_panel" data-panel="format"><h2>出力形式</h2><label class="field">形式<select id="format_select"><option value="image/webp">WebP</option><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option><option value="image/avif">AVIF</option></select></label><label class="field">品質 <output id="quality_value">85%</output><input id="quality_input" type="range" min="1" max="100" value="85"></label></section>
        <section class="tool_panel" data-panel="size"><h2>サイズ</h2><div class="field_group"><label class="field">幅 (px)<input id="width_input" type="number" min="1" placeholder="元の幅"></label><label class="field">高さ (px)<input id="height_input" type="number" min="1" placeholder="元の高さ"></label></div><label class="check_row"><input id="aspect_lock" type="checkbox" checked><span>縦横比を維持</span></label></section>
        <section class="tool_panel" data-panel="transform"><h2>回転・反転</h2><div class="icon_buttons"><button type="button" data-action="rotate_left">↶ 左回転</button><button type="button" data-action="rotate_right">↷ 右回転</button><button type="button" data-action="flip_h">↔ 水平反転</button><button type="button" data-action="flip_v">↕ 垂直反転</button></div></section>
        <section class="tool_panel" data-panel="adjust"><h2>色調補正</h2><label class="slider_row">明るさ <output id="brightness_value">0</output><input id="brightness_input" type="range" min="-100" max="100" value="0"></label><label class="slider_row">コントラスト <output id="contrast_value">0</output><input id="contrast_input" type="range" min="-100" max="100" value="0"></label><label class="slider_row">色調 <output id="saturation_value">0</output><input id="saturation_input" type="range" min="-100" max="100" value="0"></label></section>
        <section class="tool_panel" data-panel="crop"><h2>トリミング</h2><label class="check_row"><input id="crop_toggle" type="checkbox"><span>中央を正方形にトリミング</span></label></section>
      </div>
      <span id="status_message" class="status_message" role="status" aria-live="polite"></span>
    </aside>

    <section id="result_panel" class="panel result_panel" hidden>
      <div class="panel_heading"><div><p class="section_label">RESULT</p><h2>変換結果</h2><p id="result_summary" class="muted"></p></div><button id="download_all_button" class="button button_primary" type="button">ZIPで保存</button></div>
      <div id="result_list" class="result_list"></div>
    </section>

  </main>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="./script.js"></script>
</body>
</html>
