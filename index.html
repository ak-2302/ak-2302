<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ak-2302のホームページ">
    <meta name="theme-color" content="#111210">
    <link rel="stylesheet" href="./ref/style/reset.css">
    <link rel="stylesheet" href="./ref/style/style.css">
    <title>ak-2302</title>
</head>

<body>
    <header class="site-header">
        <a class="site-name" href="#top">ak-2302</a>
        <nav aria-label="メインナビゲーション">
            <a href="#accounts">Accounts</a>
            <a href="#tools">Tools</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main>
        <section class="hero" id="top">
            <div class="hero-grid" aria-hidden="true"></div>
            <p class="hero-label">Personal website</p>
            <h1>ak-2302</h1>
            <p class="hero-location">Japan / <span id="currentTime">--:--</span></p>
            <a class="scroll-link" href="#accounts">Scroll <span>↓</span></a>
        </section>

        <section class="section" id="accounts">
            <div class="section-title reveal">
                <p>01</p>
                <h2>Accounts</h2>
            </div>
            <div class="link-list reveal">
                <a href="https://github.com/ak-2302" target="_blank" rel="noreferrer">
                    <span>GitHub</span><small>github.com/ak-2302</small><b>↗</b>
                </a>
                <a href="https://qiita.com/ak_2302" target="_blank" rel="noreferrer">
                    <span>Qiita</span><small>qiita.com/ak_2302</small><b>↗</b>
                </a>
                <a href="https://zenn.dev/ak_2302" target="_blank" rel="noreferrer">
                    <span>Zenn</span><small>zenn.dev/ak_2302</small><b>↗</b>
                </a>
                <a href="https://x.com/ak_2302" target="_blank" rel="noreferrer">
                    <span>X</span><small>x.com/ak_2302</small><b>↗</b>
                </a>
            </div>
        </section>

        <section class="section tools-section" id="tools">
            <div class="section-title reveal">
                <p>02</p>
                <h2>Tools</h2>
            </div>
            <a class="tools-link reveal" href="./tool/">
                <div>
                    <span>Tool collection</span>
                    <small>作成したWebツールの一覧</small>
                </div>
                <b>View all tools <span>↗</span></b>
            </a>
        </section>

        <section class="section contact-section" id="contact">
            <div class="section-title reveal">
                <p>03</p>
                <h2>Contact</h2>
            </div>
            <form class="contact-form reveal" id="contactForm">
                <label>
                    <span>Name</span>
                    <input type="text" id="contactName" name="name" autocomplete="name" maxlength="80" required>
                </label>
                <label>
                    <span>Email</span>
                    <input type="email" id="contactEmail" name="email" autocomplete="email" maxlength="254" required>
                </label>
                <label class="message-field">
                    <span>Message</span>
                    <textarea id="contactMessage" name="message" rows="6" maxlength="1800" required></textarea>
                </label>
                <div class="form-footer">
                    <p class="form-status" id="formStatus" aria-live="polite"></p>
                    <button id="contactSend" type="submit">Send message <span>↗</span></button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>© <span id="currentYear"></span> ak-2302</p>
        <a href="#top">Back to top ↑</a>
    </footer>

    <script src="./ref/script/script.js"></script>
    <script src="./ref/script/contact.js"></script>
</body>

</html>
