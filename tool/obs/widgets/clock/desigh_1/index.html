<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Clockの調整</title>
    <link rel="stylesheet" href="../../../assets/style.css" />
    <link rel="stylesheet" href="../../../assets/configurator.css" />
  </head>
  <body>
    <header class="site-header"><a class="brand" href="../../../">OBS Widget Shelf</a><a class="back-link" href="../">← デザイン一覧</a></header>
    <main class="config-main">
      <section class="config-heading"><p class="eyebrow">CLOCK / DESIGN 01</p><h1>Digital Clock</h1><p>時・分・秒を横一列で表示するデジタル時計です。</p></section>
      <div class="config-layout">
        <section class="preview-panel"><div class="preview-stage"><iframe id="widget-preview" title="時計プレビュー"></iframe></div><div class="preview-label"><span>LIVE PREVIEW</span><span>800 × 300</span></div></section>
        <form class="control-panel" id="config-form" data-core="./core/" data-filename="digital-clock">
          <h2>表示を調整</h2>
          <div class="field"><label for="format">表示形式</label><select id="format" name="format"><option value="hms">時・分・秒</option><option value="hm">時・分</option><option value="date-hm">日付・時・分</option></select></div>
          <div class="field-row color-fields"><div class="field"><label for="color">文字色</label><input id="color" name="color" type="color" value="#f6f7f1" /></div><div class="field"><label for="accent">アクセント</label><input id="accent" name="accent" type="color" value="#b8f525" /></div><div class="field"><label for="bg">背景色</label><input id="bg" name="bg" type="color" value="#101211" /></div></div>
          <div class="field-row"><div class="field"><label for="outline">縁取り</label><input id="outline" name="outline" type="range" min="0" max="6" value="0" /></div><div class="field"><label for="shadow">影</label><input id="shadow" name="shadow" type="range" min="0" max="30" value="16" /></div></div>
          <div class="actions"><button class="button button-primary" id="copy-button" type="button">URLをコピー</button><button class="button" id="download-button" type="button">HTMLをダウンロード</button></div>
          <p class="url-output" id="url-output"></p>
        </form>
      </div>
      <section class="usage"><h2>OBSへの追加方法</h2><ol><li>表示を調整してURLをコピーします。</li><li>OBSで「ブラウザ」ソースを追加します。</li><li>URLを貼り付け、幅800・高さ300に設定します。</li></ol></section>
    </main>
    <div class="toast" id="toast" role="status"></div><script src="../../../assets/configurator.js"></script>
  </body>
</html>
