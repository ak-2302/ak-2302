        <p id="detail_copy">雨が止んだあと、世界の輪郭がすこしだけ、やわらかくなる。<br><br>湿った風が頬をなでて、遠くの灯りがきれいに滲んでいた。あの帰り道の、静かな呼吸を覚えていたくて、この標本に閉じ込めました。</p>
