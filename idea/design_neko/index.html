<!doctype html>
<html lang="ja">

  <title>ねこのあとを追って</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page_shell">
    <header class="site_header">
      <a class="brand" href="#top" aria-label="ねこのあとを追って トップへ">
        <span class="brand_cat" aria-hidden="true">⌁</span>
        <span>ねこのあとを追って</span>
      </a>
      <nav class="site_nav" aria-label="メインナビゲーション">
        <a class="is_current" href="#top">トップ</a>
        <a href="#about">このサイトについて</a>
        <a href="#contact">お問い合わせ</a>
      </nav>
    </header>

    <section class="hero" id="top" aria-labelledby="page_title">
      <div class="hero_copy">
        <h1 id="page_title">ねこのあとを<br>追って<span class="title_paw" aria-hidden="true"><span></span><i></i><b></b><em></em></span></h1>
        <div class="title_rule" aria-hidden="true"></div>
        <p>好奇心のままに、気になる場所へ。<br>わたしの考えや仕事のプロセス、<br>つくることへのまなざしを置いています。</p>
      </div>

      <div class="room_doodle" aria-hidden="true"><span class="window"></span><span class="door"></span><span class="plant">❧</span></div>
      <div class="cat_figure" aria-hidden="true"><span class="cat_tail"></span><span class="cat_body"></span><span class="cat_head"></span><span class="cat_ear left"></span><span class="cat_ear right"></span><span class="cat_leg one"></span><span class="cat_leg two"></span></div>

      <div class="paw_trail" aria-label="コンテンツへのナビゲーション">
        <a class="trail_item item_profile" href="#profile">
          <span class="paw paw_large" aria-hidden="true"></span><span class="trail_number">01</span><strong>プロフィール</strong><small>わたしについて、これまでのことや<br>大切にしている考え方を紹介します。</small>
        </a>
        <a class="trail_item item_tools" href="#tools">
          <span class="paw" aria-hidden="true"></span><span class="trail_number">02</span><strong>ツール</strong><small>普段使っているツールや<br>テクノロジーをまとめています。</small>
        </a>
        <a class="trail_item item_notes" href="#notes">
          <span class="paw" aria-hidden="true"></span><span class="trail_number">03</span><strong>ノート</strong><small>思考のメモや、制作の記録を<br>綴っています。</small>
        </a>
        <a class="trail_item item_links" href="#links">
          <span class="paw" aria-hidden="true"></span><span class="trail_number">04</span><strong>リンク</strong><small>ご縁のある素敵な人や<br>参考にしているものたち。</small>
        </a>
      </div>
    </section>

    <footer class="site_footer" id="contact"><span>Follow the cat's footsteps</span><span class="footer_paw" aria-hidden="true">•ᴥ•</span></footer>

  <script src="script.js"></script>
