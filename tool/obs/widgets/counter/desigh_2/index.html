<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inline Counterの調整</title><link rel="stylesheet" href="../../../assets/style.css"><link rel="stylesheet" href="../../../assets/configurator.css"></head><body><header class="site-header"><a class="brand" href="../../../">OBS Widget Shelf</a><a class="back-link" href="../">← デザイン一覧</a></header><main class="config-main"><section class="config-heading"><p class="eyebrow">COUNTER / DESIGN 02</p><h1>Inline Counter</h1><p>操作ボタンと数値を横一列にまとめたカウンターです。</p></section><div class="config-layout"><section class="preview-panel"><div class="preview-stage"><iframe id="widget-preview" title="横型カウンター"></iframe></div><div class="preview-label"><span>LIVE PREVIEW</span><span>760 × 260</span></div></section><form class="control-panel" id="config-form" data-core="./core/" data-filename="inline-counter"><h2>表示を調整</h2><div class="field"><label for="start">初期値</label><input id="start" name="start" type="number" value="0"></div><div class="field-row color-fields"><div class="field"><label for="color">文字色</label><input id="color" name="color" type="color" value="#ffffff"></div><div class="field"><label for="accent">アクセント</label><input id="accent" name="accent" type="color" value="#59c3ff"></div><div class="field"><label for="bg">背景色</label><input id="bg" name="bg" type="color" value="#10161b"></div></div><div class="field-row"><div class="field"><label for="outline">縁取り</label><input id="outline" name="outline" type="range" min="0" max="6" value="0"></div><div class="field"><label for="shadow">影</label><input id="shadow" name="shadow" type="range" min="0" max="30" value="10"></div></div><div class="actions"><button class="button button-primary" id="copy-button" type="button">URLをコピー</button><button class="button" id="download-button" type="button">HTMLをダウンロード</button></div><p class="url-output" id="url-output"></p></form></div><section class="usage"><h2>操作方法</h2><ol><li>UPまたは右・上・Enterで増加します。</li><li>DOWNまたは左・下・Backspaceで減少します。</li><li>RESETまたはSpaceで初期値へ戻します。</li></ol></section></main><div class="toast" id="toast"></div><script src="../../../assets/configurator.js"></script></body></html>
