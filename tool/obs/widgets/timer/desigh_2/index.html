<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compact Timerの調整</title><link rel="stylesheet" href="../../../assets/style.css"><link rel="stylesheet" href="../../../assets/configurator.css"></head><body><header class="site-header"><a class="brand" href="../../../">OBS Widget Shelf</a><a class="back-link" href="../">← デザイン一覧</a></header><main class="config-main"><section class="config-heading"><p class="eyebrow">TIMER / DESIGN 02</p><h1>Compact Timer</h1><p>狭いスペースに置きやすい横型タイマーです。</p></section><div class="config-layout"><section class="preview-panel"><div class="preview-stage"><iframe id="widget-preview" title="コンパクトタイマー"></iframe></div><div class="preview-label"><span>LIVE PREVIEW</span><span>760 × 260</span></div></section><form class="control-panel" id="config-form" data-core="./core/" data-filename="compact-timer"><h2>表示を調整</h2><div class="field-row"><div class="field"><label for="minutes">分</label><input id="minutes" name="minutes" type="number" min="0" value="10"></div><div class="field"><label for="seconds">秒</label><input id="seconds" name="seconds" type="number" min="0" max="59" value="0"></div></div><div class="field-row color-fields"><div class="field"><label for="color">文字色</label><input id="color" name="color" type="color" value="#ffffff"></div><div class="field"><label for="accent">アクセント</label><input id="accent" name="accent" type="color" value="#ff8a3d"></div><div class="field"><label for="bg">背景色</label><input id="bg" name="bg" type="color" value="#171310"></div></div><div class="field-row"><div class="field"><label for="outline">縁取り</label><input id="outline" name="outline" type="range" min="0" max="6" value="0"></div><div class="field"><label for="shadow">影</label><input id="shadow" name="shadow" type="range" min="0" max="30" value="10"></div></div><div class="actions"><button class="button button-primary" id="copy-button" type="button">URLをコピー</button><button class="button" id="download-button" type="button">HTMLをダウンロード</button></div><p class="url-output" id="url-output"></p></form></div><section class="usage"><h2>操作方法</h2><ol><li>STARTで開始、PAUSEで停止します。</li><li>RESETで設定時間へ戻します。</li><li>幅760・高さ260を目安に設定します。</li></ol></section></main><div class="toast" id="toast"></div><script src="../../../assets/configurator.js"></script></body></html>
