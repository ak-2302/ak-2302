<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Organizer</title>
    <link rel="stylesheet" href="./index.css">
</head>

<body>
    <main class="app-shell">
        <section class="hero-panel">
            <div class="hero-copy">
                <p class="eyebrow">Video Organizer</p>
                <h1>動画をまとめてアップロードし、一覧とプレビュー、出力までを一画面で。</h1>
                <p class="hero-description">
                    複数の動画ファイルをアップロードして、進捗、一覧、プレビュー、出力処理の状態を確認できます。
                </p>
            </div>

            <div class="hero-actions">
                <label class="primary-button" for="video-input">動画を追加</label>
                <input id="video-input" type="file" accept="video/*" multiple hidden>
                <button id="clear-all" class="secondary-button" type="button">全件クリア</button>
            </div>

            <div class="stats-grid" aria-label="アップロード状況">
                <article>
                    <span class="stat-label">ファイル数</span>
                    <strong id="stat-count">0</strong>
                </article>
                <article>
                    <span class="stat-label">アップロード進捗</span>
                    <strong id="upload-progress-label">0%</strong>
                </article>
            </div>
        </section>

        <section class="workspace">
            <section class="card list-card">
                <div class="section-heading">
                    <div>
                        <p class="section-kicker">ファイル一覧</p>
                        <h2>アップロードされた動画</h2>
                    </div>
                    <span class="section-note">クリックでプレビュー</span>
                </div>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>ファイル名</th>
                                <th>サイズ</th>
                                <th>長さ</th>
                            </tr>
                        </thead>
                        <tbody id="video-list">
                        </tbody>
                    </table>
                </div>
                <p id="empty-state" class="empty-state">まだ動画がありません。上部のボタンから複数ファイルを追加してください。</p>
            </section>

            <section class="card preview-card">
                <div class="section-heading">
                    <div>
                        <p class="section-kicker">プレビュー</p>
                        <h2>選択中の動画</h2>
                    </div>
                    <span id="selected-name" class="section-note">未選択</span>
                </div>

                <div class="preview-frame">
                    <video id="preview-video" controls playsinline muted></video>
                    <div id="preview-placeholder" class="preview-placeholder">
                        <p>一覧からファイルを選択するとここにプレビューが表示されます。</p>
                    </div>
                </div>
            </section>

            <section class="card output-card">
                <div class="section-heading">
                    <div>
                        <p class="section-kicker">出力</p>
                        <h2>処理を実行</h2>
                    </div>
                    <span class="section-note">進捗を表示</span>
                </div>

                <div class="output-panel">
                    <div>
                        <h3>出力進捗</h3>
                        <p id="output-status-text">まだ出力していません。</p>
                    </div>
                    <button id="export-button" class="primary-button" type="button">出力</button>
                </div>

                <div class="progress-block">
                    <div class="progress-bar-shell" aria-label="アップロード進捗">
                        <div id="upload-progress-bar" class="progress-bar progress-bar-upload"></div>
                    </div>
                    <div class="progress-bar-shell" aria-label="出力処理の進捗">
                        <div id="output-progress-bar" class="progress-bar progress-bar-output"></div>
                    </div>
                </div>
            </section>
        </section>
    </main>

    <script src="./index.js"></script>
</body>

</html>
