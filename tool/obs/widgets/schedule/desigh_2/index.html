<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timelineの調整</title><link rel="stylesheet" href="../../../assets/style.css"><link rel="stylesheet" href="../../../assets/configurator.css"></head><body><header class="site-header"><a class="brand" href="../../../">OBS Widget Shelf</a><a class="back-link" href="../">← デザイン一覧</a></header><main class="config-main"><section class="config-heading"><p class="eyebrow">SCHEDULE / DESIGN 02</p><h1>Timeline</h1><p>時刻と内容を区切って縦に表示するスケジュールです。</p></section><div class="config-layout"><section class="preview-panel"><div class="preview-stage"><iframe id="widget-preview" title="タイムライン"></iframe></div><div class="preview-label"><span>LIVE PREVIEW</span><span>760 × 520</span></div></section><form class="control-panel" id="config-form" data-core="./core/" data-filename="schedule-timeline"><h2>表示を調整</h2><div class="field"><label for="items">予定（時刻|内容）</label><textarea id="items" name="items">21:00|START
21:10|TALK
22:00|END</textarea></div><div class="field-row color-fields"><div class="field"><label for="color">文字色</label><input id="color" name="color" type="color" value="#ffffff"></div><div class="field"><label for="accent">アクセント</label><input id="accent" name="accent" type="color" value="#bb86fc"></div><div class="field"><label for="bg">背景色</label><input id="bg" name="bg" type="color" value="#15101a"></div></div><div class="field-row"><div class="field"><label for="outline">縁取り</label><input id="outline" name="outline" type="range" min="0" max="6" value="0"></div><div class="field"><label for="shadow">影</label><input id="shadow" name="shadow" type="range" min="0" max="30" value="10"></div></div><div class="actions"><button class="button button-primary" id="copy-button" type="button">URLをコピー</button><button class="button" id="download-button" type="button">HTMLをダウンロード</button></div><p class="url-output" id="url-output"></p></form></div><section class="usage"><h2>OBSへの追加方法</h2><ol><li>「時刻|内容」の形式で1行ずつ入力します。</li><li>URLをOBSへ貼り付けます。</li><li>件数に合わせて高さを調整します。</li></ol></section></main><div class="toast" id="toast"></div><script src="../../../assets/configurator.js"></script></body></html>
