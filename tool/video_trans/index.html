<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="複数の動画をブラウザ内でMP4へ一括変換するツール">
    <title>Video Batch Converter</title>
    <link rel="stylesheet" href="./index.css">
    <link rel="stylesheet" href="../ref/style/tool-theme.css">
</head>

<body>
    <main class="app-shell">
        <header class="hero">
            <div>
                <p class="eyebrow">LOCAL VIDEO TOOL</p>
                <h1>mp4変換</h1>
            </div>
            <div class="privacy-note">
                <span class="privacy-dot" aria-hidden="true"></span>
                ファイルは外部へ送信されません
            </div>
        </header>

        <section class="upload-card" id="drop-zone">
            <div class="upload-icon" aria-hidden="true">＋</div>
            <div>
                <h2>動画を追加</h2>
                <p>ここへドラッグ＆ドロップ、またはボタンから選択</p>
            </div>
            <div class="upload-actions">
                <label class="button button-primary" for="file-input">ファイルを選択</label>
                <label class="button button-secondary" for="folder-input">フォルダを選択</label>
                <input id="file-input" type="file" accept="video/*,.mkv,.avi,.mov,.webm,.m4v,.wmv,.flv" multiple hidden>
                <input id="folder-input" type="file" webkitdirectory directory multiple hidden>
            </div>
        </section>

        <section class="stats" aria-label="ファイル統計">
            <article><span>動画</span><strong id="stat-count">0</strong><small>ファイル</small></article>
            <article><span>合計サイズ</span><strong id="stat-size">0 B</strong></article>
            <article><span>重複候補</span><strong id="stat-duplicates">0</strong><small>ファイル</small></article>
            <article><span>変換予定</span><strong id="stat-output">0</strong><small>ファイル</small></article>
        </section>

        <div class="workspace">
            <section class="panel file-panel">
                <div class="panel-heading">
                    <div>
                        <p class="section-label">FILES</p>
                        <h2>アップロード一覧</h2>
                    </div>
                    <button id="clear-button" class="text-button" type="button">すべて削除</button>
                </div>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>ファイル名</th>
                                <th>サイズ</th>
                                <th>長さ</th>
                                <th>状態</th>
                                <th><span class="visually-hidden">操作</span></th>
                            </tr>
                        </thead>
                        <tbody id="video-list"></tbody>
                    </table>
                    <div id="empty-state" class="empty-state">
                        <strong>動画がまだありません</strong>
                        <span>上のエリアから動画を追加してください。</span>
                    </div>
                </div>
            </section>

            <aside class="panel settings-panel">
                <div class="panel-heading">
                    <div>
                        <p class="section-label">SETTINGS</p>
                        <h2>出力設定</h2>
                    </div>
                </div>

                <label class="switch-row">
                    <span><strong>重複を削除</strong><small>内容が同じファイルを1件にまとめる</small></span>
                    <input id="dedupe-toggle" type="checkbox" checked>
                    <i aria-hidden="true"></i>
                </label>

                <fieldset>
                    <legend>リネームルール</legend>
                    <label class="radio-row">
                        <input type="radio" name="rename-rule" value="sequence" checked>
                        <span>連番に変更 <small id="rename-preview">0001.mp4, 0002.mp4 ...</small></span>
                    </label>
                    <label class="radio-row">
                        <input type="radio" name="rename-rule" value="original">
                        <span>元のファイル名を使用 <small>拡張子のみ .mp4 に変更</small></span>
                    </label>
                </fieldset>

                <div id="sequence-options" class="option-grid">
                    <label>ゼロ埋め桁数
                        <select id="padding-select">
                            <option value="2">2桁</option>
                            <option value="3">3桁</option>
                            <option value="4" selected>4桁</option>
                            <option value="5">5桁</option>
                            <option value="6">6桁</option>
                        </select>
                    </label>
                    <label>開始番号
                        <select id="start-select">
                            <option value="0">0から</option>
                            <option value="1" selected>1から</option>
                        </select>
                    </label>
                </div>

                <label class="switch-row">
                    <span><strong>ZIPにまとめる</strong><small>変換結果を1つのファイルで保存</small></span>
                    <input id="zip-toggle" type="checkbox" checked>
                    <i aria-hidden="true"></i>
                </label>

                <label id="zip-name-field" class="field">ZIPファイル名
                    <div class="suffix-input">
                        <input id="zip-name-input" type="text" value="converted-videos" maxlength="80">
                        <span>.zip</span>
                    </div>
                </label>
            </aside>
        </div>

        <section class="panel conversion-panel">
            <div class="conversion-copy">
                <p class="section-label">CONVERT</p>
                <h2 id="status-title">変換の準備ができています</h2>
                <p id="status-text">動画を追加すると変換を開始できます。</p>
            </div>
            <div class="progress-area">
                <div class="progress-meta"><span id="progress-file">待機中</span><strong id="progress-label">0%</strong>
                </div>
                <div class="progress-track">
                    <div id="progress-bar"></div>
                </div>
            </div>
            <button id="convert-button" class="button button-accent" type="button" disabled>MP4へ変換</button>
        </section>

        <section id="result-panel" class="panel result-panel" hidden>
            <div class="panel-heading">
                <div>
                    <p class="section-label">RESULT</p>
                    <h2>変換結果</h2>
                </div>
                <button id="download-all-button" class="button button-primary" type="button">ダウンロード</button>
            </div>
            <div id="result-list" class="result-list"></div>
        </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.9.8/dist/ffmpeg.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="./index.js"></script>
</body>

</html>
