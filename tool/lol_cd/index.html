<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <div id="header">
        <div id="match-controls">
            <span id="time-display">00:00</span>
            <button id="start-timer">Start</button>
        </div>
        <button id="setting">Setting</button>
    </div>

                <img src="./img/cosmic_insight.png" alt="cosmic_insight">
            </div>
            <div class="spell">
                <img src="./img/spell/spell_Teleport.webp" alt="spell">
                <img src="./img/spell/spell_Flash.png" alt="spell">
            </div>
            <div class="item">
                <img src="./img/item/item_Zhonya's_Hourglass.jpg" alt="item">
                <img src="./img/item/item_Quicksilver_Sash.jpg" alt="item">
                <img src="./img/item/item_Guardian_Angel.jpg" alt="item">
                <img src="./img/item/item_Mikael's_Blessing.jpg" alt="item">
            </div>
        </div>
        <div class="player jungle">

                <img src="./img/item/item_Mikael's_Blessing.jpg" alt="item">
            </div>
        </div>
        <div class="player middle">
            <div class="roll">

            <div class="cosmic_insight">
